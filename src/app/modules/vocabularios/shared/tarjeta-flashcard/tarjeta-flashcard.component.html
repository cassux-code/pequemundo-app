<button
  type="button"
  class="flashcard"
  [class.flashcard-volteada]="volteada"
  (click)="voltear.emit()"
  [attr.aria-label]="(volteada ? texto : 'Tarjeta de ' + texto) + '. Toca para voltear.'"
>
  <div class="flashcard-interior">
    <div class="flashcard-cara flashcard-frente">
      <span class="flashcard-imagen" aria-hidden="true">{{ imagen }}</span>
    </div>
    <div class="flashcard-cara flashcard-reverso">
      <span class="flashcard-texto">{{ texto }}</span>
    </div>
  </div>
</button>
