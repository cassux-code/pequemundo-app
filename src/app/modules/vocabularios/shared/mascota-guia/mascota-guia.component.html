<div class="mascota-burbuja" *ngIf="mensaje">
  <span class="mascota-emoji" aria-hidden="true">🦉</span>
  <p class="mascota-texto">{{ mensaje }}</p>
  <button
    type="button"
    class="mascota-escuchar"
    aria-label="Escuchar de nuevo"
    (click)="escuchar.emit()"
  >
    🔊 Escuchar de nuevo
  </button>
</div>
